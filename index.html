<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mientras Tanto - Beto Ramon ft. EFRA</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        
        /* Hacemos la imagen redonda y le agregamos borde */
        img.portada {
            width: 250px;
            height: 250px;
            border-radius: 50%; /* Esto la hace circular */
            box-shadow: 0px 0px 20px rgba(255,255,255,0.2);
            margin-bottom: 20px;
            object-fit: cover;
            border: 5px solid #333; /* Borde oscuro simulando el disco */
        }
        
        /* Animación de girar */
        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .girando {
            animation: girar 4s linear infinite;
        }

        .boton { display: block; background: #1DB954; color: white; padding: 15px; margin: 10px auto; width: 80%; max-width: 300px; text-decoration: none; border-radius: 25px; font-weight: bold; }
        .boton.ig { background: #E1306C; }
        audio { margin-bottom: 20px; width: 80%; max-width: 300px; }
    </style>
</head>
<body>
    <h2>Beto Ramon & EFRA</h2>
    <h1>Mientras Tanto</h1>
    
    <!-- Tu imagen que ahora va a girar -->
    <img src="portada.jpeg" alt="Portada Mientras Tanto" class="portada" id="disco">
    
    <p>Escucha un adelanto:</p>
    <audio id="reproductor" controls>
        <source src="preview.mp3" type="audio/mpeg">
    </audio>

    <!-- AQUÍ METES TUS LINKS REALES ENTRE LAS COMILLAS -->
    <a href="https://open.spotify.com/track/6OxHmhvxjMebJfRRqI6Uqq" class="boton">Escuchar completa en Spotify</a>
    <a href="https://www.instagram.com/elbetto19?stkn=YjA1Yng3Zng5bW9q&utm_source=qr" class="boton ig">Instagram Beto Ramon</a>
    <a href="https://www.instagram.com/efra_larx?stkn=cXFhaGg2Z3BlcDAz" class="boton ig">Instagram EFRA</a>

    <!-- Este es el truco que hace girar la portada con el play -->
    <script>
        var audio = document.getElementById("reproductor");
        var disco = document.getElementById("disco");

        audio.onplay = function() {
            disco.classList.add("girando");
        };
        audio.onpause = function() {
            disco.classList.remove("girando");
        };
        audio.onended = function() {
            disco.classList.remove("girando");
        };
    </script>
</body>
</html>
