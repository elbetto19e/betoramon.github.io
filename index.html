<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mientras tanto — EFRA & Beto Ramon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      background: #111;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      overflow-x: hidden;
      /* Textura sutil */
      background-image:
        radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 4px 4px;
    }
    /* =========================
       MENSAJE DE ENTRADA
    ========================= */
    #mensajeEntrada {
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: .5px;
      opacity: 1;
      animation:
        desaparecerMensaje
        2.8s
        ease-in-out
        forwards;
      pointer-events: none;
    }
    @keyframes desaparecerMensaje {
      0% {
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      65% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }
    /* =========================
       CONTENIDO
    ========================= */
    #contenido {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding:
        55px
        20px
        45px;
      opacity: 0;
      transform: translateY(15px);
      animation:
        contenidoEntrada
        .9s
        ease-out
        2.2s
        forwards;
    }
    @keyframes contenidoEntrada {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* =========================
       ARTISTAS
    ========================= */
    .artistas {
      font-size: .78rem;
      letter-spacing: 3px;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    /* =========================
       TITULO
    ========================= */
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: lowercase;
    }
    /* =========================
       VINILO
    ========================= */
    .vinilo-container {
      width: 260px;
      height: 260px;
      margin:
        40px
        auto
        35px;
      position: relative;
    }
    .vinilo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 35px rgba(0,0,0,.5);
      animation:
        girar
        8s
        linear
        infinite;
      animation-play-state: paused;
    }
    .vinilo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* =========================
       BRILLO / SURCOS DEL VINILO
    ========================= */
    .vinilo::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      background:
        repeating-radial-gradient(
          circle,
          rgba(255,255,255,.08) 0px,
          rgba(255,255,255,.08) 1px,
          transparent 2px,
          transparent 6px
        );
      mix-blend-mode: screen;
    }
    .vinilo::after {
      content: "";
      position: absolute;
      width: 75px;
      height: 75px;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0,0,0,.16);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08);
      z-index: 3;
    }
    /* Centro del vinilo */
    .centro {
      position: absolute;
      width: 13px;
      height: 13px;
      background: #111;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform:
        translate(-50%, -50%);
      z-index: 4;
      box-shadow:
        0 0 0 2px rgba(255,255,255,.15);
    }
    @keyframes girar {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    /* =========================
       PREVIEW
    ========================= */
    .preview-text {
      font-size: .9rem;
      color: #aaa;
      margin-bottom: 15px;
    }
    audio {
      width: 100%;
      max-width: 350px;
      margin-bottom: 28px;
    }
    /* =========================
       BOTONES
    ========================= */
    .boton {
      width: 100%;
      max-width: 350px;
      margin: 10px auto;
      padding: 14px 18px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: .9rem;
      font-weight: 500;
      transition:
        transform .2s ease,
        background .2s ease;
    }
    .boton:hover {
      transform: translateY(-2px);
    }
    /* Spotify */
    .spotify {
      background: #1DB954;
    }
    .spotify:hover {
      background: #1ed760;
    }
    /* Instagram */
    .ig {
      background: #222;
      border:
        1px solid
        rgba(255,255,255,.12);
    }
    .ig:hover {
      background: #2b2b2b;
    }
    /* =========================
       REDES
    ========================= */
    .redes {
      width: 100%;
      max-width: 350px;
      margin:
        45px
        auto
        20px;
    }
    .redes h3 {
      font-size: 1rem;
      font-weight: 400;
      color: #aaa;
      margin:
        0
        0
        28px
        0;
      opacity: 0;
      transform:
        translateY(10px);
      animation:
        aparecerRedes
        .8s
        ease-out
        4s
        forwards;
    }
    .red-social {
      margin-bottom: 25px;
      opacity: 0;
      transform:
        translateY(15px);
      animation:
        aparecerRedSocial
        .7s
        ease-out
        forwards;
    }
    /* EFRA */
    .red-social:nth-child(2) {
      animation-delay: 4.5s;
    }
    /* BETO */
    .red-social:nth-child(3) {
      animation-delay: 5.4s;
    }
    .red-social span {
      display: block;
      font-size: .72rem;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 8px;
    }
    @keyframes aparecerRedes {
      from {
        opacity: 0;
        transform:
          translateY(10px);
      }
      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }
    @keyframes aparecerRedSocial {
      from {
        opacity: 0;
        transform:
          translateY(15px);
      }
      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }
    /* =========================
       FOOTER
    ========================= */
    footer {
      margin-top: 45px;
      font-size: .65rem;
      color: #555;
      letter-spacing: 1px;
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 480px) {
      #contenido {
        padding:
          45px
          18px
          40px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .vinilo-container {
        width: 235px;
        height: 235px;
        margin-top: 35px;
      }
    }
  </style>
</head>
<body>
  <!-- =========================
       MENSAJE DE ENTRADA
  ========================= -->
  <div id="mensajeEntrada">
    Ah… llegaste.
  </div>
  <!-- =========================
       CONTENIDO
  ========================= -->
  <main id="contenido">
    <!-- ARTISTAS -->
    <div class="artistas">
      EFRA & Beto Ramon
    </div>
    <!-- TITULO -->
    <h1>
      mientras tanto
    </h1>
    <!-- =========================
         VINILO
    ========================= -->
    <div class="vinilo-container">
      <div class="vinilo" id="vinilo">
        <img
          src="portada.jpeg"
          alt="Portada Mientras tanto"
        >
      </div>
      <div class="centro"></div>
    </div>
    <!-- =========================
         PREVIEW
    ========================= -->
    <div class="preview-text">
      Te regalo un preview:
    </div>
    <audio
      id="audio"
      controls
      preload="metadata"
    >
      <source
        src="preview.mp3"
        type="audio/mpeg"
      >
      Tu navegador no soporta audio.
    </audio>
    <!-- =========================
         SPOTIFY
    ========================= -->
    <a
      href="https://open.spotify.com/track/6OxHmhvxjMebJfRRqI6Uqq"
      class="boton spotify"
      target="_blank"
      rel="noopener noreferrer"
    >
      <i class="fa-brands fa-spotify"></i>
      Escuchar en Spotify
    </a>
    <!-- =========================
         REDES SOCIALES
    ========================= -->
    <section class="redes">
      <h3>
        Síguenos en nuestras redes
      </h3>
      <!-- EFRA -->
      <div class="red-social">
        <span>
          EFRA
        </span>
        <a
          href="https://www.instagram.com/efra_larx?stkn=cXFhaGg2Z3BlcDAz"
          class="boton ig"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-instagram fa-lg"></i>
          Instagram
        </a>
      </div>
      <!-- BETO -->
      <div class="red-social">
        <span>
          BETO
        </span>
        <a
          href="https://www.instagram.com/elbetto19?stkn=YjA1Yng3Zng5bW9q&utm_source=qr"
          class="boton ig"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-instagram fa-lg"></i>
          Instagram
        </a>
      </div>
    </section>
    <!-- =========================
         FOOTER
    ========================= -->
    <footer>
      EFRA × BETO RAMON
    </footer>
  </main>
  <!-- =========================
       JAVASCRIPT
  ========================= -->
  <script>
    const audio =
      document.getElementById("audio");
    const vinilo =
      document.getElementById("vinilo");
    /* =========================
       VINILO GIRA CUANDO SUENA
    ========================= */
    audio.addEventListener(
      "play",
      () => {
        vinilo.style.animationPlayState =
          "running";
      }
    );
    audio.addEventListener(
      "pause",
      () => {
        vinilo.style.animationPlayState =
          "paused";
      }
    );
    audio.addEventListener(
      "ended",
      () => {
        vinilo.style.animationPlayState =
          "paused";
      }
    );
  </script>
</body>
</html>
