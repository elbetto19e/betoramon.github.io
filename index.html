    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portada-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin-bottom: 30px;
        }

        .portada {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        /* Vinilo animado de fondo */
        .vinilo {
            position: absolute;
            top: 0;
            right: -50px;
            width: 240px;
            height: 240px;
            background: #111;
            border-radius: 50%;
            border: 8px solid #222;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 1;
            animation: girar 8s linear infinite;
            animation-play-state: paused;
        }

        .vinilo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #e74c3c;
            border-radius: 50%;
            border: 4px dashed #fff;
        }

        .portada-container:hover .vinilo {
            animation-play-state: running;
            transform: translateX(40px);
            transition: transform 0.5s ease;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .artista {
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        /* Sistema de retraso de 4 segundos para los enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: aparecer 0.8s ease forwards;
            animation-delay: 4s;
        }

        @keyframes aparecer {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .boton {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .boton:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .spotify {
            background-color: #1DB954;
        }

        .apple-music {
            background-color: #fa243c;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #555555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MMDW9XS2"

    <!-- End Google Tag Manager (noscript) -->

    <div class="container">
        
        <!-- Portada y Vinilo -->
        <div class="portada-container">
            <div class="vinilo"></div>
            <!-- Reemplaza el src con el link de tu imagen oficial si lo necesitas -->
            <img src="portada.jpg" alt="Mientras Tanto - EFRA & Beto Ramon" class="portada" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=500&q=80'">
        </div>

        <h1>Mientras Tanto</h1>
        <p class="artista">EFRA & Beto Ramon</p>

        <!-- Botones de Streaming (Con aparicion diferida de 4 segundos) -->
        <div class="links-container">
            
            <!-- SPOTIFY -->
            <a href="https://open.spotify.com" class="boton spotify" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-spotify fa-lg"></i>
                Escúchala en Spotify
            </a>

            <!-- APPLE MUSIC -->
            <a href="https://music.apple.com/us/album/mientras-tanto/6806528681?i=6806528682" class="boton apple-music" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-apple fa-lg"></i>
                Escúchala en Apple Music
            </a>

        </div>

        <div class="footer">
            <p>© 2026 BETO RAMON & EFRA</p>
        </div>

    </div>

</body>
</html>
